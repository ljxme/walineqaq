name: Release NPM Package

on:
  workflow_run:
    workflows: ["Generate Emoji Info"]
    types:
      - completed
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  release:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Check if version has changed
        run: |
          current_version=$(node -p "require('./package.json').version")
          latest_version=$(npm view @ljxme/walineqaq version 2>/dev/null || echo "0.0.0")

          echo "Current version: $current_version"
          echo "Latest version on npm: $latest_version"

          if [ "$current_version" = "$latest_version" ]; then
            echo "No version change, skipping release"
            echo "skip_release=true" >> "$GITHUB_ENV"
          else
            echo "Version has changed, proceeding with release"
          fi

      - name: Publish to npm
        if: env.skip_release != 'true'
        run: npm publish --access public